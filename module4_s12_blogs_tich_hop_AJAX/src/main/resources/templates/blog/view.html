<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title} + ' - Personal Blog'">Blog View</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        article {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 3rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .blog-header {
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .meta {
            color: var(--text-secondary);
            display: flex;
            gap: 1rem;
            font-size: 0.95rem;
        }

        .summary {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 2rem;
            border-left: 4px solid var(--primary);
            padding-left: 1.5rem;
        }

        .content {
            font-size: 1.125rem;
            white-space: pre-wrap;
        }

        .actions {
            margin-top: 3rem;
            display: flex;
            gap: 1rem;
            border-top: 1px solid var(--border);
            padding-top: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-outline {
            border: 1px solid var(--border);
            color: var(--text);
            background: transparent;
        }

        .btn-outline:hover {
            background-color: var(--border);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            line-height: 1.6;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .modal-text {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <a th:href="@{/blogs}" class="back-link">← Back to List</a>

        <article>
            <div class="blog-header">
                <h1 th:text="${blog.title}">Blog Title</h1>
                <div class="meta">
                    <span th:text="'By ' + ${blog.author}">Author</span>
                    <span>•</span>
                    <span th:text="${#temporals.format(blog.createdAt, 'MMMM dd, yyyy')}">Date</span>
                </div>
            </div>

            <p class="summary" th:text="${blog.summary}">Blog summary goes here...</p>

            <div class="content" th:text="${blog.content}">
                Full content goes here...
            </div>

            <div class="actions">
                <a th:href="@{/blogs/edit/{id}(id=${blog.id})}" class="btn btn-outline">Edit Post</a>
                <button class="btn btn-outline" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.2)"
                    th:onclick="'showDeleteModal(\'/blogs/delete/' + ${blog.id} + '\')'">Delete Post</button>
            </div>
        </article>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">Delete Post?</h2>
            <p class="modal-text">This action cannot be undone. Are you sure you want to delete this blog post?</p>
            <div class="modal-actions">
                <button onclick="closeDeleteModal()" class="btn btn-outline">Cancel</button>
                <a id="confirmDeleteBtn" href="#" class="btn btn-primary"
                    style="background-color: #ef4444; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; text-decoration: none;">Delete</a>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('deleteModal');
        const confirmBtn = document.getElementById('confirmDeleteBtn');

        function showDeleteModal(deleteUrl) {
            confirmBtn.href = deleteUrl;
            modal.style.display = 'flex';
        }

        function closeDeleteModal() {
            modal.style.display = 'none';
        }

        window.onclick = function (event) {
            if (event.target == modal) {
                closeDeleteModal();
            }
        }
    </script>
</body>

</html>
