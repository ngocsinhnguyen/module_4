<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Not Found - 404</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            color: #6366f1;
        }

        p {
            font-size: 1.5rem;
            color: #94a3b8;
        }

        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>404</h1>
        <p th:text="${errorMessage != null ? errorMessage : 'Page Not Found'}">Oops! The page you're looking for doesn't
            exist.</p>
        <a th:href="@{/blogs}" class="btn">Back to Home</a>
    </div>
</body>

</html>
