plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'kafka'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-streams'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    mainClass = 'com.example.KafkaModeratorApplication'
}

task runStream(type: JavaExec) {
    mainClass = 'com.example.stream.WordFilterStream'
    classpath = sourceSets.main.runtimeClasspath
}

task runProducer(type: JavaExec) {
    mainClass = 'com.example.producer.ChatProducer'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}

task runConsumer(type: JavaExec) {
    mainClass = 'com.example.consumer.ChatConsumer'
    classpath = sourceSets.main.runtimeClasspath
}

task runLoadGenerator(type: JavaExec) {
    mainClass = 'com.example.producer.LoadGenerator'
    classpath = sourceSets.main.runtimeClasspath
}

task runBoot(type: JavaExec) {
    mainClass = 'com.example.KafkaModeratorApplication'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.named('test') {
    useJUnitPlatform()
}
