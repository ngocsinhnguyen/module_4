<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>500 Internal Server Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f8f9fa;
        }

        h1 {
            color: #dc3545;
            font-size: 48px;
        }

        p {
            color: #6c757d;
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>500</h1>
    <h2>Lỗi hệ thống</h2>
    <p th:text="${message}">Đã xảy ra lỗi nghiêm trọng trên máy chủ.</p>
    <a href="/product" class="btn">Quay lại trang chủ</a>
</body>

</html>
