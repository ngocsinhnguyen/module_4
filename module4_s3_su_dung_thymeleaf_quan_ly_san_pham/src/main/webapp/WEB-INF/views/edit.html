<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sửa sản phẩm</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
            padding: 40px;
        }

        .form-container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #1c1e21;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background: #ffc107;
            color: #212529;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn-submit:hover {
            background: #e0a800;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1877f2;
            text-decoration: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: block;
        }

        .is-invalid {
            border-color: #dc3545 !important;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Cập nhật thông tin sản phẩm</h2>
        <form th:action="@{/product/update}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label>Tên sản phẩm:</label>
                <input type="text" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                <span class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="form-group">
                <label>Giá:</label>
                <input type="number" th:field="*{price}"
                    th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''">
                <span class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>
            <div class="form-group">
                <label>Mô tả:</label>
                <textarea th:field="*{description}" rows="3"
                    th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                <span class="error-message" th:if="${#fields.hasErrors('description')}"
                    th:errors="*{description}"></span>
            </div>
            <div class="form-group">
                <label>Nhà sản xuất:</label>
                <select th:field="*{producer}" th:classappend="${#fields.hasErrors('producer')} ? 'is-invalid' : ''">
                    <option value="">-- Chọn nhà sản xuất --</option>
                    <option th:each="p : ${producers}" th:value="${p}" th:text="${p}"></option>
                </select>
                <span class="error-message" th:if="${#fields.hasErrors('producer')}" th:errors="*{producer}"></span>
            </div>
            <button type="submit" class="btn-submit">Cập nhật</button>
        </form>
        <a th:href="@{/product}" class="back-link">Quay lại danh sách</a>
    </div>
</body>

</html>
