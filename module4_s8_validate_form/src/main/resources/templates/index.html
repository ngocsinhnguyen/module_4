<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Đăng Ký Tài Khoản</h1>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="firstname">Tên</label>
            <input type="text" id="firstname" th:field="*{firstname}" placeholder="Nhập Tên">
            <div class="error" th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}">Lỗi Tên</div>
        </div>
        <div class="form-group">
            <label for="lastname">Họ</label>
            <input type="text" id="lastname" th:field="*{lastname}" placeholder="Họ">
            <div class="error" th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}">Lỗi Họ</div>
        </div>
        <div class="form-group">
            <label for="phonenumber">Số Điện Thoại</label>
            <input type="text" id="phonenumber" th:field="*{phonenumber}" placeholder="Nhập Số Điện Thoại">
            <div class="error" th:if="${#fields.hasErrors('phonenumber')}" th:errors="*{phonenumber}">Lỗi Số Điện Thoại</div>
        </div>
        <div class="form-group">
            <label for="age">Tuổi</label>
            <input type="number" id="age" th:field="*{age}" placeholder="Nhập Tuổi">
            <div class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Lỗi Tuổi</div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" th:field="*{email}" placeholder="Enter email">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Lỗi Email</div>
        </div>
        <button type="submit">Đăng Ký</button>
    </form>
</div>
</body>
</html>
