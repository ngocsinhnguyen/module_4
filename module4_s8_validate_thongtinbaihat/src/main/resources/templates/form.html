<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${songDTO.id != null ? 'Cập nhật bài hát' : 'Thêm bài hát mới'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="card-title mb-0"
                            th:text="${songDTO.id != null ? 'Cập nhật bài hát' : 'Thêm bài hát mới'}"></h2>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/songs/save}" th:object="${songDTO}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label for="name" class="form-label">Tên bài hát:</label>
                                <input type="text" class="form-control" th:field="*{name}" id="name"
                                    th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="artist" class="form-label">Nghệ sĩ thể hiện:</label>
                                <input type="text" class="form-control" th:field="*{artist}" id="artist"
                                    th:classappend="${#fields.hasErrors('artist')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('artist')}"
                                    th:errors="*{artist}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="genre" class="form-label">Thể loại nhạc:</label>
                                <textarea class="form-control" th:field="*{genre}" id="genre" rows="3"
                                    th:classappend="${#fields.hasErrors('genre')} ? 'is-invalid' : ''"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('genre')}"
                                    th:errors="*{genre}"></div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary"
                                    th:text="${songDTO.id != null ? 'Cập nhật' : 'Thêm mới'}"></button>
                                <a href="/songs" class="btn btn-secondary">Hủy bỏ</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
