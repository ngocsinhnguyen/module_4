<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách bài hát</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary">Quản lý bài hát</h1>
            <a href="/songs/add" class="btn btn-success">Thêm bài hát mới</a>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Tên bài hát</th>
                            <th>Nghệ sĩ</th>
                            <th>Thể loại</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="song : ${songs}">
                            <td th:text="${song.name}"></td>
                            <td th:text="${song.artist}"></td>
                            <td th:text="${song.genre}"></td>
                            <td>
                                <a th:href="@{/songs/edit/{id}(id=${song.id})}" class="btn btn-sm btn-warning">Sửa</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(songs)}">
                            <td colspan="4" class="text-center text-muted">Chưa có bài hát nào</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
