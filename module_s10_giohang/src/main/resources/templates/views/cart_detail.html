<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2rem;
            font-weight: 700;
        }

        .product-detail {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .product-content {
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .product-image-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .product-info h2 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .product-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-label {
            color: #666;
            font-weight: 600;
        }

        .info-value {
            color: #667eea;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .quantity-section {
            margin: 30px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .qty-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .qty-btn:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .quantity-display {
            font-weight: 700;
            font-size: 1.5rem;
            min-width: 50px;
            text-align: center;
            color: #667eea;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-back {
            background: #6c757d;
            color: white;
        }

        .btn-back:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-shop {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-shop:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stock-badge {
            background: #28a745;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .product-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .product-info h2 {
                font-size: 1.4rem;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📦 Chi Tiết Sản Phẩm</h1>
        </header>

        <div class="product-detail">
            <div class="product-content">
                <div class="product-info">
                    <h2 th:text="${product.name}">Product Name</h2>
                    <p class="product-description" th:text="${product.description}">Product description</p>

                    <div class="info-row">
                        <span class="info-label">Đơn giá:</span>
                        <span class="info-value" th:text="${#numbers.formatDecimal(product.price, 0, 0)} + ' đ'">0
                            đ</span>
                    </div>

                    <div class="info-row" th:if="${product.stock != null}">
                        <span class="info-label">Tồn kho:</span>
                        <span class="stock-badge" th:text="${product.stock} + ' sản phẩm'">0</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Thành tiền:</span>
                        <span class="info-value"
                            th:text="${#numbers.formatDecimal(product.price * quantity, 0, 0)} + ' đ'">0 đ</span>
                    </div>

                    <div class="quantity-section">
                        <div class="info-label" style="text-align: center; margin-bottom: 10px;">Số lượng trong giỏ
                        </div>
                        <div class="quantity-controls">
                            <a th:href="@{/shopping-cart/decrease/{id}(id=${product.id})}" class="qty-btn">−</a>
                            <span class="quantity-display" th:text="${quantity}">1</span>
                            <a th:href="@{/shopping-cart/increase/{id}(id=${product.id})}" class="qty-btn">+</a>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <a href="/shopping-cart" class="btn btn-back">← Quay lại giỏ hàng</a>
                        <a href="/shop" class="btn btn-shop">Tiếp tục mua sắm</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
