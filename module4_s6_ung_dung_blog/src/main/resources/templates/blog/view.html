<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>View Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/latest/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }

        .container {
            max-width: 800px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .blog-title {
            color: #333;
            font-weight: bold;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .blog-meta {
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .blog-content {
            line-height: 1.8;
            font-size: 1.1rem;
            white-space: pre-wrap;
        }

        .btn-back {
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="blog-title" th:text="${blog.title}"></h1>
        <div class="blog-meta">
            Posted by <strong th:text="${blog.author}"></strong> on
            <span th:text="${#temporals.format(blog.createdDate, 'dd-MM-yyyy HH:mm')}"></span>
        </div>
        <div class="blog-content" th:text="${blog.content}"></div>

        <div class="d-flex justify-content-between btn-back">
            <a th:href="@{/blogs}" class="btn btn-secondary">Back to List</a>
            <a th:href="@{/blogs/{id}/edit(id=${blog.id})}" class="btn btn-warning">Edit This Blog</a>
        </div>
    </div>

</body>

</html>
