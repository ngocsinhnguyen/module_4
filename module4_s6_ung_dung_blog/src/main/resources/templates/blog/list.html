<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/latest/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/latest/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .container {
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn-create {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Blog List</h1>
        <a th:href="@{/blogs/create}" class="btn btn-primary btn-create">Create New Blog</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <table class="table table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="blog : ${blogs}">
            <td th:text="${blog.id}"></td>
            <td>
                <a th:href="@{/blogs/{id}/view(id=${blog.id})}" th:text="${blog.title}" class="text-decoration-none"></a>
            </td>
            <td th:text="${blog.author}"></td>
            <td th:text="${#temporals.format(blog.createdDate, 'dd-MM-yyyy HH:mm')}"></td>
            <td>
                <a th:href="@{/blogs/{id}/edit(id=${blog.id})}" class="btn btn-sm btn-warning">Edit</a>
                <button type="button" class="btn btn-sm btn-danger"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#deleteModal' + ${blog.id}">
                    Delete
                </button>

                <!-- Delete Modal -->
                <div class="modal fade" th:id="'deleteModal' + ${blog.id}" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                Are you sure you want to delete this blog: <strong th:text="${blog.title}"></strong>?
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <form th:action="@{/blogs/{id}/delete(id=${blog.id})}" method="post">
                                    <button type="submit" class="btn btn-danger">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(blogs)}">
            <td colspan="5" class="text-center">No blogs found.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
