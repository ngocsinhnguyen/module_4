<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0">Chi tiết sách</h2>
                    </div>
                    <div class="card-body">
                        <div class="text-muted mb-2">Mã Sách: <span th:text="${book.id}"></span></div>
                        <h3 th:text="${book.title}" class="text-primary mb-3"></h3>
                        <p class="fs-5">Số lượng còn lại: <strong th:text="${book.quantity}"></strong></p>

                        <form th:action="@{/books/borrow}" method="post">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <button type="submit" class="btn btn-success btn-lg w-100"
                                th:disabled="${book.quantity <= 0}">Mượn sách</button>
                        </form>
                        <div th:if="${book.quantity <= 0}" class="text-danger mt-3 text-center">
                            Hiện tại đã hết sách để mượn.
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <a th:href="@{/books}" class="btn btn-link">Quay lại danh sách</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
