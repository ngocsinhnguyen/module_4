<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Trả sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0">Trả sách</h2>
                    </div>
                    <div class="card-body py-4">
                        <form th:action="@{/books/return}" method="post">
                            <div class="mb-4">
                                <label for="borrowCode" class="form-label fs-5">Nhập mã số mượn sách (5 chữ số):</label>
                                <input type="text" class="form-control form-control-lg text-center" id="borrowCode"
                                    name="borrowCode" required maxlength="5" pattern="\d{5}" placeholder="00000">
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Xác nhận trả sách</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <a th:href="@{/books}" class="btn btn-link">Quay lại danh sách</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
