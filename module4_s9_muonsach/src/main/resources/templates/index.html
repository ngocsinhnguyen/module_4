<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thư viện sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Danh sách sách</h1>
        <div>
            <a th:href="@{/books/return}" class="btn btn-outline-primary">Trả sách</a>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="book : ${books}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-primary" th:text="${book.title}"></h5>
                    <p class="card-text">
                        Số lượng còn lại: <span th:text="${book.quantity}" class="badge bg-secondary"></span>
                    </p>
                </div>
                <div class="card-footer bg-white border-0 text-end">
                    <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
