<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: html(title='Thông tin Nhân viên', content=~{::section})}">

<head></head>

<body>
    <section>
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <h1 th:text="${employee.id == null ? 'Thêm Nhân viên' : 'Cập nhật Nhân viên'}"></h1>

            <form th:action="@{/employees/save}" th:object="${employee}" method="post">
                <input type="hidden" th:field="*{id}">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label>Mã nhân viên (NV-XXXX):</label>
                        <input type="text" th:field="*{employeeCode}" placeholder="Ví dụ: NV-0001">
                        <div class="error-msg" th:if="${#fields.hasErrors('employeeCode')}" th:errors="*{employeeCode}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Họ tên:</label>
                        <input type="text" th:field="*{fullName}" placeholder="Nguyễn Văn A">
                        <div class="error-msg" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="form-group">
                        <label>Ngày sinh:</label>
                        <input type="date" th:field="*{dob}">
                        <div class="error-msg" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                        <div class="error-msg" th:if="${#fields.hasErrors('ageValid')}" th:errors="*{ageValid}"></div>
                    </div>

                    <div class="form-group">
                        <label>Giới tính:</label>
                        <div style="display: flex; gap: 1.5rem; padding: 0.625rem 0;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0;">
                                <input type="radio" th:field="*{gender}" value="Nam" style="width: auto;"> Nam
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0;">
                                <input type="radio" th:field="*{gender}" value="Nữ" style="width: auto;"> Nữ
                            </label>
                        </div>
                        <div class="error-msg" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                    </div>

                    <div class="form-group">
                        <label>Lương cơ bản (≥ 5.000.000):</label>
                        <input type="number" th:field="*{salary}" step="1000">
                        <div class="error-msg" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    </div>

                    <div class="form-group">
                        <label>Phòng ban:</label>
                        <select th:field="*{department}">
                            <option value="">-- Chọn phòng ban --</option>
                            <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">
                            </option>
                        </select>
                        <div class="error-msg" th:if="${#fields.hasErrors('department')}" th:errors="*{department}">
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                    <a th:href="@{/employees}" class="btn" style="background-color: #e2e8f0;">Hủy</a>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
