<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">XYZ Corp - Employee Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <a th:href="@{/employees}" th:classappend="${currentUri.startsWith('/employees') ? 'active' : ''}">Quản lý
                Nhân viên</a>
            <a th:href="@{/departments}" th:classappend="${currentUri.startsWith('/departments') ? 'active' : ''}">Quản
                lý Phòng ban</a>
        </nav>
    </header>

    <div class="container">
        <div th:replace="${content}"></div>
    </div>
</body>

</html>
