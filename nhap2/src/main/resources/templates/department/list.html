<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: html(title='Danh sách Phòng ban', content=~{::section})}">

<head></head>

<body>
    <section>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Danh sách Phòng ban</h1>
                <a th:href="@{/departments/create}" class="btn btn-primary">Thêm Phòng ban mới</a>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <table>
                <thead>
                    <tr>
                        <th>Mã phòng ban</th>
                        <th>Tên phòng ban</th>
                        <th>Số nhân viên</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="dept : ${departments}">
                        <td th:text="${dept.code}"></td>
                        <td th:text="${dept.name}"></td>
                        <td th:text="${dept.employees != null ? dept.employees.size() : 0}"></td>
                        <td>
                            <a th:href="@{/departments/edit/{id}(id=${dept.id})}" class="btn btn-primary btn-sm">Sửa</a>
                            <a th:href="@{/departments/delete/{id}(id=${dept.id})}" class="btn btn-danger btn-sm"
                                onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(departments)}">
                        <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 2rem;">Chưa có dữ
                            liệu phòng ban.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>

</html>
