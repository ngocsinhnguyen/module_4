<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: html(title='Thông tin Phòng ban', content=~{::section})}">

<head></head>

<body>
    <section>
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h1 th:text="${department.id == null ? 'Thêm Phòng ban' : 'Cập nhật Phòng ban'}"></h1>

            <form th:action="@{/departments/save}" th:object="${department}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label>Mã phòng ban:</label>
                    <input type="text" th:field="*{code}" placeholder="Ví dụ: PB-HR">
                    <div class="error-msg" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>

                <div class="form-group">
                    <label>Tên phòng ban:</label>
                    <input type="text" th:field="*{name}" placeholder="Ví dụ: Hành chính Nhân sự">
                    <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                    <a th:href="@{/departments}" class="btn" style="background-color: #e2e8f0;">Hủy</a>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
