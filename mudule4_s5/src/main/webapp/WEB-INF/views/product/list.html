<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #3498db;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .price {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Quản lý sản phẩm</h1>

        <div th:if="${message}"
            style="padding: 10px; background-color: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 20px;"
            th:text="${message}"></div>

        <div class="actions"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <a th:href="@{/products/create}" class="btn-add"
                style="background-color: #2ecc71; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold;">+
                Thêm sản phẩm</a>

            <form th:action="@{/products}" method="get" style="display: flex; gap: 10px;">
                <input type="text" name="searchName" th:value="${searchName}" placeholder="Tìm theo tên..."
                    style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                <input type="number" name="minPrice" th:value="${minPrice}" placeholder="Giá từ..."
                    style="padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100px;">
                <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="đến..."
                    style="padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100px;">
                <button type="submit"
                    style="background-color: #3498db; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">Tìm
                    kiếm</button>
                <a th:href="@{/products}" style="padding: 8px; text-decoration: none; color: #7f8c8d;">Xóa lọc</a>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá (VNĐ)</th>
                    <th>Mô tả</th>
                    <th>Hãng sản xuất</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td th:text="${product.name}">Tên</td>
                    <td class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                        0 ₫</td>
                    <td th:text="${product.description}">Mô tả</td>
                    <td th:text="${product.producer}">Hãng</td>
                    <td>
                        <a th:href="@{/products/{id}/edit(id=${product.id})}"
                            style="color: #3498db; text-decoration: none; margin-right: 10px;">Sửa</a>
                        <a th:href="@{/products/{id}/delete(id=${product.id})}"
                            style="color: #e74c3c; text-decoration: none;"
                            onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
