<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #3498db;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .price {
            color: #e74c3c;
            font-weight: bold;
        }

        /* Price Filter Dropdown Styles */
        .price-filter {
            position: relative;
            display: inline-block;
        }

        #price-display {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            min-width: 150px;
            font-size: 14px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #price-display::after {
            content: '▼';
            font-size: 10px;
            margin-left: 10px;
            color: #7f8c8d;
        }

        .price-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: white;
            min-width: 250px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 15px;
            z-index: 1000;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-top: 5px;
        }

        .price-dropdown.show {
            display: block;
        }

        .price-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            font-size: 13px;
            color: #666;
            width: 50px;
        }

        .input-group input {
            flex: 1;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .dropdown-actions {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-apply {
            background-color: #3498db;
            color: white;
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-clear-inner {
            background-color: #f1f1f1;
            color: #666;
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Quản lý sản phẩm</h1>

        <div th:if="${message}"
            style="padding: 10px; background-color: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 20px;"
            th:text="${message}"></div>

        <div class="actions"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <a th:href="@{/products/create}" class="btn-add"
                style="background-color: #2ecc71; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold;">+
                Thêm sản phẩm</a>

            <form th:action="@{/products}" method="get" id="searchForm"
                style="display: flex; gap: 10px; align-items: center;">
                <input type="text" name="searchName" th:value="${searchName}" placeholder="Tìm theo tên..."
                    style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">

                <div class="price-filter">
                    <div id="price-display" onclick="togglePriceDropdown()">
                        <span id="range-text">Chọn khoảng giá</span>
                    </div>
                    <div id="price-dropdown" class="price-dropdown">
                        <div class="price-inputs">
                            <div class="input-group">
                                <label>Từ:</label>
                                <input type="number" name="minPrice" id="minPriceInput" th:value="${minPrice}"
                                    placeholder="VNĐ">
                            </div>
                            <div class="input-group">
                                <label>Đến:</label>
                                <input type="number" name="maxPrice" id="maxPriceInput" th:value="${maxPrice}"
                                    placeholder="VNĐ">
                            </div>
                        </div>
                        <div class="dropdown-actions">
                            <button type="button" class="btn-clear-inner" onclick="clearPrice()">Xóa</button>
                            <button type="submit" class="btn-apply">Áp dụng</button>
                        </div>
                    </div>
                </div>

                <button type="submit"
                    style="background-color: #3498db; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">Tìm
                    kiếm</button>
                <a th:href="@{/products}" style="padding: 8px; text-decoration: none; color: #7f8c8d;">Xóa lọc</a>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá (VNĐ)</th>
                    <th>Mô tả</th>
                    <th>Hãng sản xuất</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td th:text="${product.name}">Tên</td>
                    <td class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                        0 ₫</td>
                    <td th:text="${product.description}">Mô tả</td>
                    <td th:text="${product.producer}">Hãng</td>
                    <td>
                        <a th:href="@{/products/{id}/edit(id=${product.id})}"
                            style="color: #3498db; text-decoration: none; margin-right: 10px;">Sửa</a>
                        <a th:href="@{/products/{id}/delete(id=${product.id})}"
                            style="color: #e74c3c; text-decoration: none;"
                            onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:inline="javascript">
        function togglePriceDropdown() {
            document.getElementById('price-dropdown').classList.toggle('show');
        }

        function clearPrice() {
            document.getElementById('minPriceInput').value = '';
            document.getElementById('maxPriceInput').value = '';
            updatePriceDisplay();
        }

        function updatePriceDisplay() {
            const min = document.getElementById('minPriceInput').value;
            const max = document.getElementById('maxPriceInput').value;
            const textSpan = document.getElementById('range-text');

            if (min && max) {
                textSpan.innerText = formatNumber(min) + ' - ' + formatNumber(max);
            } else if (min) {
                textSpan.innerText = 'Từ ' + formatNumber(min);
            } else if (max) {
                textSpan.innerText = 'Đến ' + formatNumber(max);
            } else {
                textSpan.innerText = 'Chọn khoảng giá';
            }
        }

        function formatNumber(num) {
            return new Intl.NumberFormat().format(num);
        }

        // Close dropdown when clicking outside
        window.onclick = function (event) {
            if (!event.target.closest('.price-filter')) {
                const dropdown = document.getElementById('price-dropdown');
                if (dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                }
            }
        }

        // Initial call to set correctly on page load
        updatePriceDisplay();
    </script>
</body>

</html>
