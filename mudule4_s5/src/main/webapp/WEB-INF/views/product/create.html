<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Thêm mới sản phẩm</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Thêm mới sản phẩm</h1>
        <form th:action="@{/products/save}" th:object="${product}" method="post">
            <div class="form-group">
                <label>Tên sản phẩm:</label>
                <input type="text" th:field="*{name}" />
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="form-group">
                <label>Giá (VNĐ):</label>
                <input type="number" th:field="*{price}" />
                <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            <div class="form-group">
                <label>Mô tả:</label>
                <textarea th:field="*{description}"></textarea>
                <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            <div class="form-group">
                <label>Hãng sản xuất:</label>
                <input type="text" th:field="*{producer}" />
                <div class="error" th:if="${#fields.hasErrors('producer')}" th:errors="*{producer}"></div>
            </div>
            <div style="text-align: center;">
                <button type="submit" class="btn btn-primary">Lưu</button>
                <a th:href="@{/products}" class="btn btn-secondary">Hủy</a>
            </div>
        </form>
    </div>
</body>

</html>
